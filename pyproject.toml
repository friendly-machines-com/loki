[build-system]
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[project]
# Distribution name; flit normalizes it to the "loki_agent" package.
name = "loki-agent"
# The package's __version__ is also Loki's HTTP identity version.
dynamic = ["version"]
description = "Really really minimal-dependency coding agent"
readme = "README.md"
# Windows mkdir(mode=0o700) requires 3.10.15, 3.11.10, 3.12.4, or 3.13+.
# A lower bound alone would still admit unpatched 3.11 and 3.12 releases.
requires-python = ">=3.10.15,!=3.11.0,!=3.11.1,!=3.11.2,!=3.11.3,!=3.11.4,!=3.11.5,!=3.11.6,!=3.11.7,!=3.11.8,!=3.11.9,!=3.12.0,!=3.12.1,!=3.12.2,!=3.12.3"
license = {file = "COPYING"}
authors = [{name = "Danny Milosavljevic"}]
keywords = ["ai", "llm", "agent", "coding"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
loki = "loki_agent.__main__:main"
loki-acp = "loki_agent.acp_main:main"
