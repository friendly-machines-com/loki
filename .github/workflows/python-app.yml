# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 stays the lowest supported branch, but only where a supported
          # 3.11 exists: its mkdir(0700) fix (3.11.10) ships source-only, so no
          # Windows installer exists above 3.11.9 and Windows must use 3.12.4+.
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install vulture
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Install the package for its console entrypoints (Windows)
      # The end-to-end tests launch the sanctioned entrypoints. On Windows that
      # is the console script pip writes from [project.scripts] -- loki.exe and
      # loki-acp.exe -- so the checkout scripts are never run through an
      # interpreter, which would test the module rather than the entrypoint.
      if: runner.os == 'Windows'
      run: python -m pip install -e .
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # flake8's default filename pattern only matches *.py, so "flake8 ."
        # skips the extensionless console launchers; name them explicitly or a
        # syntax error in one of them passes CI unnoticed.
        flake8 loki-setup loki-acp --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Check for dead code with vulture
      # Fails on anything not named in vulture_whitelist.py, so new dead
      # functions/classes/attributes cannot land silently.
      run: python -m vulture
    - name: Allow unprivileged user namespaces (Linux)
      # The credential-isolation path (runtime_isolations.py) enters a private
      # user+mount namespace via unshare(CLONE_NEWUSER|CLONE_NEWNS) and then
      # writes "deny" to /proc/self/setgroups before mapping uid/gid. On
      # Ubuntu 24.04 the AppArmor restriction
      # kernel.apparmor_restrict_unprivileged_userns=1 denies the CAP_SYS_ADMIN
      # that setgroups write needs, so every real-process test dies with:
      #   Security initialization error: could not configure
      #   /proc/self/setgroups: [Errno 13] Permission denied
      # Disable only that one restriction for this job; the tests still run as
      # the normal unprivileged runner user.
      if: runner.os == 'Linux'
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Configure the Windows workspace container
      # Every Windows entrypoint refuses to start until a container is
      # configured ("run loki-setup"), so the end-to-end tests need one. The
      # workspace is the test temp root: each test's TemporaryDirectory() then
      # lands inside it, and the container's inherited workspace grant covers
      # it (the gate looks up the nearest configured ancestor). Applied at
      # setup time and never widened from a session.
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $workspace = Join-Path $env:RUNNER_TEMP 'loki-workspace'
        New-Item -ItemType Directory -Force -Path $workspace | Out-Null
        python -m loki_agent.windows_setup --configure $workspace
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m loki_agent.windows_setup --verify $workspace
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "TEMP=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Append
        "TMP=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Test
      run: |
        # tests/run_suite.py writes progress through and dumps every thread's
        # stack if the suite stalls, so a hang names its frame before the
        # job timeout instead of being canceled invisibly.
        python -u tests/run_suite.py

  windows-storage-investigation:
    # Independent of build/lint: failures there must not suppress these probes.
    name: Windows storage primitives (${{ matrix.runtime }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12.4 is the minimum Windows can install, so the floor itself must
          # be covered here: this job is the evidence base for the Windows
          # storage/ACL behaviour, and the build job's Windows leg runs the
          # suite as the elevated runner.
          - runtime: cpython-3.12
            python: "3.12"
          - runtime: cpython-3.13
            python: "3.13"
          - runtime: msys2-ucrt
    steps:
    - uses: actions/checkout@v4
    - name: Set up official CPython
      if: matrix.runtime != 'msys2-ucrt'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        architecture: x64
    - name: Set up native MSYS2 UCRT Python
      if: matrix.runtime == 'msys2-ucrt'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-python
    - name: Probe Windows storage primitives (CPython)
      id: cpython-probes
      if: matrix.runtime != 'msys2-ucrt'
      shell: bash
      run: |
        set -e -o pipefail
        mkdir -p windows-diagnostics
        python -c "import sys; print('python=' + sys.executable)" >> "$GITHUB_OUTPUT"
        {
          python -c "import os, sys; print(sys.executable, sys.version, flush=True); assert os.name == 'nt', 'native Windows Python required'" &&
          python -u tests/test_windows_primitives.py
        } 2>&1 | tee windows-diagnostics/primitives.log
    - name: Probe Windows storage primitives (MSYS2 UCRT)
      id: msys2-probes
      if: matrix.runtime == 'msys2-ucrt'
      shell: 'msys2 {0}'
      run: |
        set -e -o pipefail
        mkdir -p windows-diagnostics
        python -c "import sys; print('python=' + sys.executable)" >> "$GITHUB_OUTPUT"
        {
          python -c "import os, sys; print(sys.executable, sys.version, flush=True); assert os.name == 'nt', 'native Windows Python required'" &&
          python -u tests/test_windows_primitives.py
        } 2>&1 | tee windows-diagnostics/primitives.log
    - name: Probe storage as a separate standard user
      # Run even when an elevated control probe fails (currently relative
      # Win32 rename); never substitute an elevated run if account setup fails.
      if: always()
      shell: pwsh
      env:
        PROBE_PYTHON: ${{ steps.cpython-probes.outputs.python || steps.msys2-probes.outputs.python }}
      run: |
        & ./.github/scripts/windows_storage_probes.ps1 -PythonPath $env:PROBE_PYTHON
    - name: Probe AppContainer containment from a standard-user broker
      if: always()
      shell: pwsh
      env:
        PROBE_PYTHON: ${{ steps.cpython-probes.outputs.python || steps.msys2-probes.outputs.python }}
      run: |
        & ./.github/scripts/windows_storage_probes.ps1 -PythonPath $env:PROBE_PYTHON -Probe appcontainer
    - name: Upload investigation diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-storage-${{ matrix.runtime }}
        path: windows-diagnostics/
        if-no-files-found: warn

  windows-portable:
    needs: build
    name: Windows portable ZIP
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        architecture: x64
    - name: Install packaging dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "pyinstaller==6.16.0" .
    - name: Build portable executables
      run: |
        python -m PyInstaller --noconfirm --clean --onedir --console --name loki loki.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m PyInstaller --noconfirm --clean --onedir --console --name loki-acp loki-acp
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Separate build via its spec: only the setup editor bundles tcl/tk.
        python -m PyInstaller --noconfirm --clean loki-setup.spec
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Create portable ZIP
      run: |
        Copy-Item COPYING, README.md dist/
        Compress-Archive -Path dist/* -DestinationPath loki-windows-x64-portable.zip
    - name: Upload portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: loki-windows-x64-portable
        path: loki-windows-x64-portable.zip
        if-no-files-found: error
        compression-level: 0
