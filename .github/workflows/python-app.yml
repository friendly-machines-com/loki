# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test
      run: |
        python -m unittest discover -s tests -v

  windows-storage-investigation:
    # Independent of build/lint: failures there must not suppress these probes.
    name: Windows storage primitives (${{ matrix.runtime }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: cpython-3.10
            python: "3.10"
          - runtime: cpython-3.13
            python: "3.13"
          - runtime: msys2-ucrt
    steps:
    - uses: actions/checkout@v4
    - name: Set up official CPython
      if: matrix.runtime != 'msys2-ucrt'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        architecture: x64
    - name: Set up native MSYS2 UCRT Python
      if: matrix.runtime == 'msys2-ucrt'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-python
    - name: Probe Windows storage primitives (CPython)
      if: matrix.runtime != 'msys2-ucrt'
      shell: bash
      run: |
        set -o pipefail
        mkdir -p windows-diagnostics
        {
          python -c "import os, sys; print(sys.executable, sys.version, flush=True); assert os.name == 'nt', 'native Windows Python required'" &&
          python -u tests/test_windows_primitives.py
        } 2>&1 | tee windows-diagnostics/primitives.log
    - name: Probe Windows storage primitives (MSYS2 UCRT)
      if: matrix.runtime == 'msys2-ucrt'
      shell: 'msys2 {0}'
      run: |
        set -o pipefail
        mkdir -p windows-diagnostics
        {
          python -c "import os, sys; print(sys.executable, sys.version, flush=True); assert os.name == 'nt', 'native Windows Python required'" &&
          python -u tests/test_windows_primitives.py
        } 2>&1 | tee windows-diagnostics/primitives.log
    - name: Upload investigation diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-storage-${{ matrix.runtime }}
        path: windows-diagnostics/
        if-no-files-found: warn

  windows-portable:
    needs: build
    name: Windows portable ZIP
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        architecture: x64
    - name: Install packaging dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "pyinstaller==6.16.0" .
    - name: Build portable executables
      run: |
        python -m PyInstaller --noconfirm --clean --onedir --console --name loki loki.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m PyInstaller --noconfirm --clean --onedir --console --name loki-acp loki-acp
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Create portable ZIP
      run: |
        Copy-Item COPYING, README.md dist/
        Compress-Archive -Path dist/* -DestinationPath loki-windows-x64-portable.zip
    - name: Upload portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: loki-windows-x64-portable
        path: loki-windows-x64-portable.zip
        if-no-files-found: error
        compression-level: 0
